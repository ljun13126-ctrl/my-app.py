[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 100
enableStaticServing = true

[browser]
gatherUsageStats = false

[global]
developmentMode = false
showWarningOnDirectExecution = false

[theme]
base = "dark"
primaryColor = "#d4af37"
backgroundColor = "#0a0f1e"
